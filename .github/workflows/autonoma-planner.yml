name: Autonoma Planner · mall full scan

on:
  workflow_dispatch:
    inputs:
      fresh:
        description: "Discard previous planner progress (--fresh). Uncheck to --resume from last artifact."
        type: boolean
        default: false
      coding_agent:
        description: "Coding agent for preview/SDK steps (claude|codex|none)"
        required: true
        default: "none"
      model:
        description: "Optional model id. Leave EMPTY for Autonoma default (recommended)."
        required: false
        default: ""

concurrency:
  group: autonoma-planner-mall
  cancel-in-progress: false

jobs:
  plan:
    name: Scan mall with Planner
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Show tree
        run: |
          du -sh mall mall-admin-web || true
          test -d mall/mall-admin
          test -f mall-admin-web/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Require Autonoma secrets
        env:
          AUTONOMA_API_TOKEN: ${{ secrets.AUTONOMA_API_TOKEN }}
          AUTONOMA_APPLICATION_ID: ${{ secrets.AUTONOMA_APPLICATION_ID }}
          AUTONOMA_GENERATION_ID: ${{ secrets.AUTONOMA_GENERATION_ID }}
          AUTONOMA_SHARED_SECRET: ${{ secrets.AUTONOMA_SHARED_SECRET }}
          AUTONOMA_DISTINCT_ID: ${{ secrets.AUTONOMA_DISTINCT_ID }}
        run: |
          missing=0
          for k in AUTONOMA_API_TOKEN AUTONOMA_APPLICATION_ID AUTONOMA_GENERATION_ID AUTONOMA_SHARED_SECRET AUTONOMA_DISTINCT_ID; do
            if [ -z "${!k}" ]; then
              echo "::error::缺少 Secret: $k"
              missing=1
            fi
          done
          echo "APPLICATION_ID prefix=${AUTONOMA_APPLICATION_ID:0:8}..."
          echo "GENERATION_ID prefix=${AUTONOMA_GENERATION_ID:0:8}..."
          echo "DISTINCT_ID prefix=${AUTONOMA_DISTINCT_ID:0:6}..."
          exit "$missing"

      - name: Restore previous planner state
        if: ${{ inputs.fresh != true }}
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: autonoma-state-*
          merge-multiple: true
          path: /home/runner/.autonoma-restore

      - name: Unpack restored state
        if: ${{ inputs.fresh != true }}
        run: |
          set -euxo pipefail
          if [ -d /home/runner/.autonoma-restore ] && [ "$(ls -A /home/runner/.autonoma-restore 2>/dev/null | wc -l)" -gt 0 ]; then
            mkdir -p /home/runner/.autonoma
            # artifact may contain nested .autonoma or flat files
            if [ -d /home/runner/.autonoma-restore/.autonoma ]; then
              cp -a /home/runner/.autonoma-restore/.autonoma/. /home/runner/.autonoma/
            else
              cp -a /home/runner/.autonoma-restore/. /home/runner/.autonoma/
            fi
            echo "Restored state:"
            find /home/runner/.autonoma -maxdepth 3 -type f | head -50
          else
            echo "No previous state artifact found; will start/continue with cloud generation id only."
          fi

      - name: Run Autonoma Planner (non-interactive)
        env:
          AUTONOMA_API_URL: https://api.autonoma.app
          AUTONOMA_API_TOKEN: ${{ secrets.AUTONOMA_API_TOKEN }}
          AUTONOMA_APPLICATION_ID: ${{ secrets.AUTONOMA_APPLICATION_ID }}
          AUTONOMA_GENERATION_ID: ${{ secrets.AUTONOMA_GENERATION_ID }}
          AUTONOMA_SHARED_SECRET: ${{ secrets.AUTONOMA_SHARED_SECRET }}
          AUTONOMA_DISTINCT_ID: ${{ secrets.AUTONOMA_DISTINCT_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CI: true
          HOME: /home/runner
          FRESH: ${{ inputs.fresh }}
          CODING_AGENT: ${{ inputs.coding_agent }}
          MODEL: ${{ inputs.model }}
        run: |
          set -euxo pipefail
          EXTRA=()
          if [ "$FRESH" = "true" ]; then
            EXTRA+=(--fresh)
          else
            EXTRA+=(--resume)
          fi
          if [ -n "${MODEL:-}" ]; then
            EXTRA+=(--model "$MODEL")
          fi

          if [ "$CODING_AGENT" = "none" ]; then
            npx --yes @autonoma-ai/planner@latest --non-interactive \
              --frontend mall-admin-web \
              --backend mall \
              "${EXTRA[@]}"
            npx --yes @autonoma-ai/planner@latest upload || true
            npx --yes @autonoma-ai/planner@latest status || true
          else
            npx --yes @autonoma-ai/planner@latest --non-interactive \
              --coding-agent "$CODING_AGENT" \
              --frontend mall-admin-web \
              --backend mall \
              --permission-mode bypassPermissions \
              "${EXTRA[@]}"
          fi

          echo "State after run:"
          find /home/runner/.autonoma -maxdepth 3 -type f 2>/dev/null | head -80 || true
          du -sh /home/runner/.autonoma 2>/dev/null || true

      - name: Upload planner state (including hidden dirs)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autonoma-state-${{ github.run_id }}
          path: /home/runner/.autonoma
          if-no-files-found: warn
          retention-days: 14
          include-hidden-files: true
